# =============================================================================
# Transport Intelligence — Forum Feeds Configuration
# =============================================================================
# Fora kierowcow, spedytorow i transportu w Europie.
# Najcenniejsze zrodlo crowdsourced intelligence.
#
# Kazdy feed:
#   name: nazwa do wyswietlania i logowania
#   url: URL glownej strony/sekcji forum
#   rss_url: jawny URL RSS feed (null = auto-detect)
#   trust_score: 0.0-1.0 (fora = niski trust, wymaga weryfikacji)
#   is_official: false (fora nigdy nie sa oficjalne)
#   language: kod jezyka ISO 639-1
#   forum_type: phpbb | vbulletin | xenforo | discourse | wordpress | generic
#   keywords_extra: dodatkowe slowa kluczowe per forum (opcjonalne)
# =============================================================================

