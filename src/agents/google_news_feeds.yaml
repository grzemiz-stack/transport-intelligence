# =============================================================================
# Google News RSS Feeds — konfiguracja per kraj/region
# =============================================================================
# Kazdy region buduje Google News RSS URL:
#   https://news.google.com/rss/search?q={query}&hl={lang}&gl={country}&ceid={country}:{lang}
#
# Query powinno zawierac slowa kluczowe transportowe + opcjonalnie nazwe miasta/regionu.
# Google News automatycznie agreguje lokalne gazety.

germany:
  language: de
  regions:
    - name: "Hamburg"
      query: "LKW Diebstahl OR Ladungsdiebstahl OR Spedition Insolvenz"
      lang: "de"
      country: "DE"
    - name: "NRW Duisburg Krefeld"
      query: "LKW Diebstahl Duisburg OR Krefeld OR Spedition"
      lang: "de"
      country: "DE"
    - name: "Bremen Bremerhaven"
      query: "LKW Diebstahl Bremen OR Bremerhaven OR Hafen Transport"
      lang: "de"
      country: "DE"
    - name: "Frankfurt Hessen"
      query: "LKW Diebstahl Frankfurt OR Hessen OR Autobahn Raststätte"
      lang: "de"
      country: "DE"
    - name: "München Bayern"
      query: "LKW Diebstahl München OR Bayern OR Brenner Transport"
      lang: "de"
      country: "DE"
    - name: "Berlin Brandenburg"
      query: "LKW Diebstahl Berlin OR Brandenburg OR Rastplatz"
      lang: "de"
      country: "DE"
    - name: "DE Nationwide Theft"
      query: "LKW Diebstahl OR Ladungsdiebstahl"
      lang: "de"
      country: "DE"
    - name: "DE Nationwide Spedition"
      query: "Spedition Insolvenz OR LKW Unfall Autobahn"
      lang: "de"
      country: "DE"

