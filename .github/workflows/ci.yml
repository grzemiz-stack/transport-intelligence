name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-characters-long!!"
      POSTGRES_PASSWORD: "testpassword"
      DATABASE_URL: "postgresql+asyncpg://test:testpassword@localhost:5432/test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v
